name: Godot project checks
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install checksum-verified Godot 4.6.3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ligame-godot
          cd /tmp/ligame-godot
          release=https://github.com/godotengine/godot/releases/download/4.6.3-stable
          curl --fail --location --retry 3 "$release/Godot_v4.6.3-stable_linux.x86_64.zip" -o engine.zip
          curl --fail --location --retry 3 "$release/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          mv engine.zip Godot_v4.6.3-stable_linux.x86_64.zip
          awk '$2 == "Godot_v4.6.3-stable_linux.x86_64.zip" {print}' SHA512-SUMS.txt > engine.sha512
          test -s engine.sha512
          sha512sum --check engine.sha512
          unzip -q Godot_v4.6.3-stable_linux.x86_64.zip
          mv Godot_v4.6.3-stable_linux.x86_64 godot
          chmod +x godot
          echo /tmp/ligame-godot >> "$GITHUB_PATH"
      - name: Import, test systems and traverse levels
        run: python3 tools/check.py
